<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2 a:hover {
            color: red;
            background-color: balck;
            font-size: 50px;
        }
        h1 :hover {
            cursor: pointer;
            color: aqua;
        }
        h3 a:link {
            color: orange;  
        }
        h3 a:visited {
            color: green;
        }
        h3 a:active {
            color: brown;
        }
        input[type="text"]:focus {
            background-color: blue;
            color: white;

        }
        ul li:first-child {
            color: red;
        }
        ul li:last-child {
            color: green;
        }
    </style>
 
</head>
<body>
    <h1>Pseudo selector</h1>
    <h2>
        <a href="hover selector">Hover selector</a>
    </h2>
    <h3>
        <a href="http://google.com">Google</a>
        <a href="http://youtube.com">YouTube</a>
        <a href="http://times.com">Times</a>
    </h3>
    <input type="text" name="" focus="">
    <ul>
        <li>Apple</li>
        <li>Orange</li>
        <li>Banana</li>
    </ul>
</body>
</html>
